[package]
name = "hactar-cli"
version = "0.1.0"
edition = "2021"
authors = ["Brett Regnier <brregnie@cisco.com>"]
description = "Firmware flashing and serial monitoring tool for Hactar devices"

[[bin]]
name = "hactar-cli"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Serial communication
serialport = "4.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal colors
colored = "2.1"

# Crypto
md5 = "0.7"

# Terminal input
rustyline = "14.0"

# Utilities
glob = "0.3"

[dev-dependencies]
