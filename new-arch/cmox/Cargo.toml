[package]
name = "cmox"
version = "0.1.0"
edition = "2021"
authors = ["Rich Barnet"]
description = "Idiomatic Rust bindings to STM32 CMOX cryptographic library"
repository = "https://github.com/your-repo/cmox"
license = "MIT OR Apache-2.0"
keywords = ["cryptography", "stm32", "cmox", "no-std", "embedded"]
categories = ["cryptography", "embedded", "no-std"]

[dependencies]
cmox-sys = { path = "../cmox-sys", default-features = false }

# Rust Crypto traits
digest = { version = "0.10", default-features = false, features = ["mac", "core-api"] }
cipher = { version = "0.4", default-features = false }
aead = { version = "0.5", default-features = false }
signature = { version = "2.2", default-features = false }
elliptic-curve = { version = "0.13", default-features = false }

# Utility crates
rand_core = { version = "0.6", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
subtle = { version = "2.6", default-features = false }
heapless = { version = "0.8", default-features = false }
hybrid-array = { version = "0.2", default-features = false }

[features]
# STM32 family selection features - choose one based on your STM32 MCU family
# These features enable optimized implementations and activate appropriate cmox-sys features
stm32-auto = ["cm4"]           # Auto-detect target (default, may be larger/slower)
stm32f0 = ["cm0"]              # STM32F0 series (Cortex-M0)
stm32f1 = ["cm3"]              # STM32F1 series (Cortex-M3)
stm32f2 = ["cm3"]              # STM32F2 series (Cortex-M3)
stm32f3 = ["cm4"]              # STM32F3 series (Cortex-M4)
stm32f4 = ["cm4"]              # STM32F4 series (Cortex-M4)
stm32f7 = ["cm7"]              # STM32F7 series (Cortex-M7)
stm32g0 = ["cm0plus"]          # STM32G0 series (Cortex-M0+)
stm32g4 = ["cm4"]              # STM32G4 series (Cortex-M4)
stm32h5 = ["cm33"]             # STM32H5 series (Cortex-M33)
stm32h7 = ["cm7"]              # STM32H7 series (Cortex-M7)
stm32h7ab = ["cm7"]            # STM32H7A/B series (Cortex-M7)
stm32l0 = ["cm0plus"]          # STM32L0 series (Cortex-M0+)
stm32l1 = ["cm3"]              # STM32L1 series (Cortex-M3)
stm32l4 = ["cm4"]              # STM32L4 series (Cortex-M4)
stm32l5 = ["cm33"]             # STM32L5 series (Cortex-M33)
stm32wb = ["cm4"]              # STM32WB series (Cortex-M4)
stm32wba = ["cm33"]            # STM32WBA series (Cortex-M33)
stm32wl = ["cm4"]              # STM32WL series (Cortex-M4)

# Raw Cortex M version selection features
cm0 = ["cmox-sys/cm0"]
cm0plus = ["cmox-sys/cm0plus"]
cm3 = ["cmox-sys/cm3"]
cm33 = ["cmox-sys/cm33"]
cm4 = ["cmox-sys/cm4"]
cm7 = ["cmox-sys/cm7"]

[dev-dependencies]
hex = { version = "0.4", default-features = false, features = ["alloc"] }
